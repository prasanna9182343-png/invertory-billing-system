{% extends "base.html" %}{% block content %}<div class="d-flex justify-content-between align-items-center mb-4"><h1 class="h2">Customers</h1><a class="btn btn-primary" href="{% url 'customer_create' %}">＋ Add customer</a></div>
<div class="panel table-responsive"><table class="table"><thead><tr><th>Name</th><th>Phone</th><th>Email</th></tr></thead><tbody>{% for c in customers %}<tr><td>{{ c.name }}</td><td>{{ c.phone|default:"—" }}</td><td>{{ c.email|default:"—" }}</td></tr>{% empty %}<tr><td colspan="3" class="text-muted">No customers added yet.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}

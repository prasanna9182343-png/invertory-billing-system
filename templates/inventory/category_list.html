{% extends "base.html" %}{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4"><h1 class="h2">Categories</h1><a class="btn btn-primary" href="{% url 'category_create' %}">＋ Add category</a></div>
<div class="panel table-responsive"><table class="table"><thead><tr><th>Name</th><th>Description</th><th>Products</th></tr></thead><tbody>{% for c in categories %}<tr><td>{{ c.name }}</td><td>{{ c.description|default:"—" }}</td><td>{{ c.products.count }}</td></tr>{% empty %}<tr><td colspan="3" class="text-muted">No categories yet.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
